[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arabic-livekit-voice-agent"
version = "0.1.0"
description = "Arabic and English LiveKit voice agents using Groq and Deepgram."
requires-python = ">=3.10"
dependencies = [
  "groq>=1.0.0",
  "livekit-agents[deepgram,groq,silero]>=1.5.0,<2.0.0",
  "python-dotenv>=1.1.0",
  "rich>=14.0.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[project.scripts]
arabic-voice-agent = "arabic_voice_agent.agent:main"
pipeline-demo = "arabic_voice_agent.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_voice_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
